name: Deploy no GitHub Pages

# Sem actions de terceiros (o repositório só permite actions do próprio dono):
# o workflow usa apenas git e npm, que já vêm na máquina do GitHub, e publica
# a build na branch gh-pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Baixar o código
        run: git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" site

      - name: Instalar e gerar a build
        working-directory: site
        run: |
          node -v
          npm ci
          npm run build

      - name: Publicar na branch gh-pages
        working-directory: site/dist
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" gh-pages
